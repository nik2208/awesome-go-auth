<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .container { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 40px; width: 100%; max-width: 420px; }
  h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #1a1d2e; }
  .subtitle { font-size: 14px; color: #6b7280; margin-bottom: 32px; }
  .tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 2px solid #f3f4f6; }
  .tab { padding: 10px 20px; cursor: pointer; font-size: 14px; font-weight: 500; color: #6b7280; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab.active { color: #4f46e5; border-bottom-color: #4f46e5; }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: #374151; }
  input { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
  input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
  .btn { width: 100%; padding: 11px; border-radius: 8px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-primary:hover { background: #4338ca; }
  .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
  .divider span { font-size: 13px; color: #9ca3af; white-space: nowrap; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }
  .oauth-btn { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; transition: background 0.2s; }
  .oauth-btn:hover { background: #f9fafb; }
  .error { color: #dc2626; font-size: 13px; margin-top: 8px; padding: 8px 12px; background: #fef2f2; border-radius: 6px; display: none; }
  .success { color: #065f46; font-size: 13px; margin-top: 8px; padding: 8px 12px; background: #d1fae5; border-radius: 6px; display: none; }
  .link-btn { background: none; border: none; color: #4f46e5; cursor: pointer; font-size: 13px; text-decoration: underline; }
  .section { display: none; }
  .section.active { display: block; }
  .totp-input { letter-spacing: 8px; text-align: center; font-size: 24px; font-weight: 700; }
</style>
</head>
<body>
<div class="container">
  <h1 id="page-title">Welcome back</h1>
  <p class="subtitle" id="page-subtitle">Sign in to continue</p>

  <div class="tabs" id="main-tabs">
    <div class="tab active" onclick="switchTab('login')">Sign In</div>
    <div class="tab" onclick="switchTab('register')">Register</div>
    <div class="tab" onclick="switchTab('magic')">Magic Link</div>
  </div>

  <!-- Login -->
  <div id="tab-login" class="section active">
    <div class="form-group"><label>Email</label><input type="email" id="login-email" placeholder="you@example.com" autocomplete="email"></div>
    <div class="form-group"><label>Password</label><input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"></div>
    <div style="text-align:right;margin-bottom:16px"><button class="link-btn" onclick="switchTab('forgot')">Forgot password?</button></div>
    <button class="btn btn-primary" id="login-btn" onclick="doLogin()">Sign In</button>
    <div class="error" id="login-error"></div>
    <div class="success" id="login-success"></div>

    <div class="divider"><span>or continue with</span></div>
    <button class="oauth-btn" onclick="oauthRedirect('google')">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>
    <button class="oauth-btn" onclick="oauthRedirect('github')">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
      Continue with GitHub
    </button>
  </div>

  <!-- Register -->
  <div id="tab-register" class="section">
    <div class="form-group"><label>Email</label><input type="email" id="reg-email" placeholder="you@example.com"></div>
    <div class="form-group"><label>Password</label><input type="password" id="reg-password" placeholder="Min 8 characters"></div>
    <div class="form-group"><label>Tenant ID <span style="color:#9ca3af">(optional)</span></label><input id="reg-tenant" placeholder="your-org"></div>
    <button class="btn btn-primary" id="reg-btn" onclick="doRegister()">Create Account</button>
    <div class="error" id="reg-error"></div>
    <div class="success" id="reg-success"></div>
  </div>

  <!-- Magic Link -->
  <div id="tab-magic" class="section">
    <div class="form-group"><label>Email</label><input type="email" id="magic-email" placeholder="you@example.com"></div>
    <button class="btn btn-primary" onclick="doMagicLink()">Send Magic Link</button>
    <div class="error" id="magic-error"></div>
    <div class="success" id="magic-success"></div>
  </div>

  <!-- Forgot Password -->
  <div id="tab-forgot" class="section">
    <p style="font-size:14px;color:#6b7280;margin-bottom:16px">Enter your email to receive a password reset link.</p>
    <div class="form-group"><label>Email</label><input type="email" id="forgot-email" placeholder="you@example.com"></div>
    <button class="btn btn-primary" onclick="doForgot()">Send Reset Link</button>
    <div style="margin-top:12px"><button class="link-btn" onclick="switchTab('login')">← Back to Sign In</button></div>
    <div class="error" id="forgot-error"></div>
    <div class="success" id="forgot-success"></div>
  </div>

  <!-- TOTP -->
  <div id="tab-totp" class="section">
    <p style="font-size:14px;color:#6b7280;margin-bottom:16px">Enter the 6-digit code from your authenticator app.</p>
    <div class="form-group"><input type="text" id="totp-code" class="totp-input" placeholder="000000" maxlength="6" inputmode="numeric"></div>
    <button class="btn btn-primary" onclick="doTOTP()">Verify</button>
    <div class="error" id="totp-error"></div>
  </div>
</div>

<script src="auth.js"></script>
<script>
const API = window.location.origin;
let pendingUser = null;

function switchTab(tab) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const titles = { login: 'Welcome back', register: 'Create account', magic: 'Magic Link', forgot: 'Reset password', totp: 'Two-Factor Auth' };
  document.getElementById('page-title').textContent = titles[tab] || '';
}

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}
function showSuccess(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg; el.style.display = 'block';
}

async function doLogin() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const r = await fetch(API + '/auth/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email, password}) });
    const d = await r.json();
    if (r.ok) {
      if (window.AuthSDK) AuthSDK.storeTokens(d.tokens);
      showSuccess('login-success', 'Signed in! Redirecting…');
      setTimeout(() => window.dispatchEvent(new CustomEvent('auth:login', {detail: d})), 800);
    } else if (r.status === 403 && d.error?.includes('two-factor')) {
      pendingUser = d; switchTab('totp');
    } else { showError('login-error', d.error || 'Invalid credentials'); }
  } catch { showError('login-error', 'Network error'); }
  btn.disabled = false; btn.textContent = 'Sign In';
}

async function doRegister() {
  const email = document.getElementById('reg-email').value;
  const password = document.getElementById('reg-password').value;
  const tenantID = document.getElementById('reg-tenant').value;
  const btn = document.getElementById('reg-btn');
  btn.disabled = true; btn.textContent = 'Creating account…';
  try {
    const r = await fetch(API + '/auth/register', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email, password, tenant_id: tenantID}) });
    const d = await r.json();
    if (r.ok) {
      if (window.AuthSDK) AuthSDK.storeTokens(d.tokens);
      showSuccess('reg-success', 'Account created! Welcome aboard.');
      setTimeout(() => window.dispatchEvent(new CustomEvent('auth:register', {detail: d})), 800);
    } else { showError('reg-error', d.error || 'Registration failed'); }
  } catch { showError('reg-error', 'Network error'); }
  btn.disabled = false; btn.textContent = 'Create Account';
}

async function doMagicLink() {
  const email = document.getElementById('magic-email').value;
  const r = await fetch(API + '/auth/magic-link/send', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email}) }).catch(() => null);
  if (!r) { showError('magic-error', 'Network error'); return; }
  showSuccess('magic-success', 'Magic link sent! Check your email.');
}

async function doForgot() {
  const email = document.getElementById('forgot-email').value;
  const r = await fetch(API + '/auth/forgot-password', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email}) }).catch(() => null);
  showSuccess('forgot-success', 'Reset link sent if this email exists.');
}

async function doTOTP() {
  const code = document.getElementById('totp-code').value;
  const r = await fetch(API + '/auth/totp/verify', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({code, user_id: pendingUser?.user?.id, tenant_id: pendingUser?.user?.tenant_id}) }).catch(() => null);
  if (!r || !r.ok) { showError('totp-error', 'Invalid code'); return; }
  const d = await r.json();
  if (window.AuthSDK) AuthSDK.storeTokens(d.tokens);
  window.dispatchEvent(new CustomEvent('auth:login', {detail: d}));
}

function oauthRedirect(provider) {
  window.location.href = API + '/oauth/' + provider + '/authorize';
}

// Handle magic link token from URL
const params = new URLSearchParams(window.location.search);
if (params.get('token')) {
  fetch(API + '/auth/magic-link/verify', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({token: params.get('token')}) })
    .then(r => r.json()).then(d => { if (d.tokens && window.AuthSDK) AuthSDK.storeTokens(d.tokens); });
}
</script>
</body>
</html>
